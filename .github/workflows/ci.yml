name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting and the build environment gates. If this fails,
  # nothing else is worth running.
  validate:
    name: format and enforce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The validate phase is where spotless:check and the enforcer execution are
      # bound. Calling the goals directly would run them without their configured
      # executions, so the enforcer would find no rules and fail.
      - name: Spotless and enforcer
        run: mvn -B --no-transfer-progress validate

  build:
    name: build on JDK ${{ matrix.java }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum toolchain, 21 is the virtual-thread target, 25 is
        # the newest release we promise to build on. Published bytecode is
        # Java 11 regardless.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
      - name: Verify published bytecode targets Java 11
        if: matrix.java == '17'
        run: |
          class=$(unzip -p acemq-amqp-api/target/acemq-amqp-api-*.jar \
                  org/acemq/amqp/api/Capability.class | xxd -p -l 8 | cut -c13-16)
          echo "class file major version: 0x$class (expected 0037 = 55 = Java 11)"
          test "$class" = "0037"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # "Supports RabbitMQ 3.13" was a claim nothing checked: every integration test
  # hardcoded the 4.x image. This runs the same suite against the previous major
  # release, which is the version most production estates are actually on.
  #
  # One job rather than another dimension on the build matrix: the JDK matrix is
  # about compiling and the broker version is about behaviour, and multiplying
  # them would triple the container time to re-prove what one run already shows.
  compatibility:
    name: integration tests on RabbitMQ 3.13
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integration tests against 3.13
        run: |
          mvn -B --no-transfer-progress -DskipTests -Djacoco.skip=true install
          mvn -B --no-transfer-progress verify \
            -pl acemq-transport-rabbitmq \
            -Dacemq.test.rabbitmq.image=rabbitmq:3.13-management \
            -Djacoco.skip=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-rabbitmq-3.13
          path: '**/target/failsafe-reports/**'
          retention-days: 7

  # Snapshots are published to GitHub Packages on every green push to main.
  # Tagged releases additionally go to Maven Central; see RELEASING.md.
  publish-snapshot:
    name: publish snapshot to GitHub Packages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Deploy
        run: mvn -B --no-transfer-progress -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
