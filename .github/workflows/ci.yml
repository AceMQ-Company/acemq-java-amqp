name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting and the build environment gates. If this fails,
  # nothing else is worth running.
  validate:
    name: format and enforce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The validate phase is where spotless:check and the enforcer execution are
      # bound. Calling the goals directly would run them without their configured
      # executions, so the enforcer would find no rules and fail.
      - name: Spotless and enforcer
        run: mvn -B --no-transfer-progress validate

      # The benchmark gate is Python and has no other test. It was wrong for
      # eight nights and nothing said so, because the only thing exercising it
      # was the nightly it was supposed to protect. Runs in a second, here rather
      # than nightly, so a broken gate is caught on the pull request that breaks
      # it.
      - name: Test the benchmark gate
        run: python3 etc/test-benchmark-checks.py

  build:
    name: build on JDK ${{ matrix.java }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum toolchain, 21 is the virtual-thread target, 25 is
        # the newest release we promise to build on. Published bytecode is
        # Java 11 regardless.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Check nothing skipped
        # A skip reads as success. Go and Python both fail on one, and Python only
        # grew the guard after seven TLS tests had skipped on every run for the
        # life of that job -- green throughout as "53 passed, 7 skipped" -- because
        # nothing started a TLS broker and nothing noticed that nothing had. Java
        # had no equivalent, so a @Disabled added to quieten a flake would have
        # stopped testing whatever it covered and said nothing.
        #
        # This reads Surefire's and Failsafe's XML rather than their "Tests run:
        # ..., Skipped: S" line; check-nothing-skipped.py says why at length, but
        # the short version is that the console is a stream shared with a suite
        # that logs at DEBUG, and the summary counts skips without naming them.
        #
        # --require-integration because the other half of the failure is the
        # integration tests not running at all, which no count of unit-test skips
        # would reveal.
        run: python3 etc/check-nothing-skipped.py --require-integration .

      # acemq-amqp-native sits behind the `native` profile, so no ordinary CI job
      # compiles it -- and the static-analysis profile only activates on JDK 21.
      # The intersection of those two facts is a module that NullAway checks
      # nowhere except the nightly native workflow, which is how the same class of
      # error reached a release tag once and main twice. Compiling it here costs
      # seconds and moves the discovery to the pull request.
      #
      # Compile rather than verify: building the image is the nightly's job and
      # needs GraalVM. This is about the analysis, not the binary.
      - name: Compile the native module under static analysis
        if: matrix.java == '21'
        run: mvn -B --no-transfer-progress -Pnative -pl acemq-amqp-native -am -DskipTests compile

      - name: Verify published bytecode targets Java 11
        if: matrix.java == '17'
        run: |
          class=$(unzip -p acemq-amqp-api/target/acemq-amqp-api-*.jar \
                  org/acemq/amqp/api/Capability.class | xxd -p -l 8 | cut -c13-16)
          echo "class file major version: 0x$class (expected 0037 = 55 = Java 11)"
          test "$class" = "0037"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: '**/target/surefire-reports/**'
          retention-days: 7

  # "Supports RabbitMQ 3.13" was a claim nothing checked: every integration test
  # hardcoded the 4.x image. This runs the same suite against the previous major
  # release, which is the version most production estates are actually on.
  #
  # One job rather than another dimension on the build matrix: the JDK matrix is
  # about compiling and the broker version is about behaviour, and multiplying
  # them would triple the container time to re-prove what one run already shows.
  compatibility:
    name: integration tests on RabbitMQ 3.13
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integration tests against 3.13
        run: |
          mvn -B --no-transfer-progress -DskipTests -Djacoco.skip=true install
          mvn -B --no-transfer-progress verify \
            -pl acemq-transport-rabbitmq \
            -Dacemq.test.rabbitmq.image=rabbitmq:3.13-management \
            -Djacoco.skip=true

      - name: Check nothing skipped
        # The same guard, and it matters more here than in the build job: this one
        # exists solely to prove the suite passes against 3.13, so a test that
        # quietly stopped running would leave the whole claim resting on nothing.
        # The first Maven invocation above runs with -DskipTests and writes no
        # reports, so everything found here comes from the run that matters.
        run: python3 etc/check-nothing-skipped.py --require-integration .

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-rabbitmq-3.13
          path: '**/target/failsafe-reports/**'
          retention-days: 7

  # Snapshots are published to GitHub Packages on every green push to main.
  # Tagged releases go to the Git-hosted Maven repository; see RELEASING.md.
  publish-snapshot:
    name: publish snapshot to GitHub Packages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Deploy
        run: mvn -B --no-transfer-progress -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  badge-matches-the-release:
    name: the README badge names the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the version badge against the newest release tag
        # A README badge is the first thing a reader sees and nothing keeps it
        # in step. This one said 0.1.4 while the library was at 0.7.0 -- six
        # minor versions, sitting at the top of the page, wrong since 0.1.4 was
        # the truth. acemq-java-amqp stays correct only because its release
        # rewrites the documented version; every other repository updates the
        # badge by hand, which means sometimes.
        #
        # Tags come from ls-remote so this needs no token on a scheduled run.
        # Only plain vX.Y.Z tags count: Go publishes nested modules as
        # codec/avro/vX.Y.Z, and those are not the repository's version.
        run: |
          newest=$(git ls-remote --tags origin \
            | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -1)
          badge=$(grep -oE 'badge/version-[0-9][0-9.]*' README.md | head -1 | sed 's|badge/version-||')

          if [ -z "$newest" ]; then
            echo "no release tags yet, so there is nothing for the badge to disagree with"
            exit 0
          fi
          if [ -z "$badge" ]; then
            echo "::error::no version badge found in README.md, so this check cannot do its job"
            exit 1
          fi
          # Behind is the failure; ahead is a release being prepared.
          #
          # The badge is bumped in the commit that readies a release, which is
          # pushed before the tag exists -- so for a few minutes the badge names
          # a version no tag does. Failing on any difference would redden that
          # commit and block the release it is part of, which is the check
          # sabotaging the thing it is meant to protect. Only a badge older than
          # the newest release is wrong.
          older=$(printf '%s\n%s\n' "$badge" "$newest" | sort -V | head -1)
          if [ "$badge" != "$newest" ] && [ "$older" = "$badge" ]; then
            echo "::error::the README badge says $badge but the newest release is $newest."
            echo "::error::Edit the version badge in README.md and set it to $newest."
            exit 1
          fi
          if [ "$badge" != "$newest" ]; then
            echo "the badge says $badge and the newest release is $newest; a release looks to be in flight"
            exit 0
          fi
          echo "the badge says $badge, which is the newest release"
