# Build the documentation site and publish it to GitHub Pages.
#
# The site is the markdown under docs/ rendered to HTML, plus aggregated Javadoc
# for every module under /apidocs/.
#
# Javadoc is part of the site rather than an afterthought because these
# artifacts are not on Maven Central, and javadoc.io only serves what Central
# has. Self-hosting is the only way anyone reads the API documentation, so it is
# generated from the same commit as the prose and can never drift from it.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '**/src/main/java/**'
      - '.github/workflows/docs.yml'
      - '.github/scripts/build-docs-site.sh'
      - 'pom.xml'
  workflow_dispatch:

# One deployment at a time; a queued run supersedes a waiting one rather than
# racing it. In-progress runs are allowed to finish so a half-published site is
# never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

# Least privilege for every job that does not ask for more. Without this the
# token gets the repository default, which on a public repository is read-only
# today and is an organisation setting somebody can change later -- and a
# workflow whose privileges depend on a setting elsewhere is one nobody can
# review. Jobs needing more declare it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the nightly benchmark run's artifact, which is where the numbers
      # on the benchmarks page come from.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc

      - name: Aggregate the Javadoc
        # -DskipTests: this job documents the code, it does not verify it. CI
        # already ran the full suite on this commit.
        run: mvn -B --no-transfer-progress -DskipTests -Djacoco.skip=true javadoc:aggregate

      # The benchmarks page is generated from the most recent successful nightly
      # run, never written by hand -- a number typed into a document is correct
      # on the day it is typed, which is how the README came to quote 421 against
      # 422 microseconds from a laptop run with 40% error bars.
      #
      # A missing artifact is not a failure. The generator then writes a page
      # saying no run has been recorded, which is the only true thing available
      # and better than a page of stale numbers.
      - name: Render the benchmarks page from the latest nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --workflow nightly-benchmarks.yml --status success \
                     --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name benchmark-results --dir /tmp/benchmarks || true
            python3 etc/render-benchmarks-page.py /tmp/benchmarks/current.json \
                    --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
          else
            python3 etc/render-benchmarks-page.py /tmp/benchmarks/none.json
          fi

      - name: Render the pages
        run: bash .github/scripts/build-docs-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # A job's own block replaces the workflow default rather than adding to it,
    # so contents is repeated here. This is GitHub's own deploy-pages triple.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    # Failures only. A message for every push to main would be noise nobody
    # reads, and a channel people mute is worse than no channel. Success on
    # workflow_dispatch used to be announced too, which stopped being useful once
    # the release dispatches this job itself -- that turned every release into two
    # messages saying the same thing.
    if: always() && needs.deploy.result == 'failure'
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.deploy.result }}
      title: >-
        ${{ needs.deploy.result == 'success'
            && 'AceMQ for Java documentation published'
            || 'AceMQ for Java documentation build FAILED' }}
      message: >-
        ${{ needs.deploy.result == 'success'
            && 'The guide and the API reference are live.'
            || 'The site was not updated, so it still shows the previous version.' }}
      url: https://acemq-company.github.io/acemq-java-amqp/
    secrets: inherit
