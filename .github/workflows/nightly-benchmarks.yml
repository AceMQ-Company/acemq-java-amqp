name: nightly-benchmarks

# Benchmarks are too slow for a pull request, so they run here and compare each
# result against the stored baseline. A run that produces a number nobody
# compares is a number nobody reads, so the comparison is the point of the job
# and the reason it can fail.
#
# It can also fail for the wrong reason, and did, every night from 27 August: a
# 5% budget was enforced on the difference between two means whose confidence
# intervals were +/-7%, and a baseline measured on a laptop was compared against
# ubuntu-latest. Both are fixed -- the checks compare intervals, the benchmarks
# run enough forks to have intervals worth comparing, and the baseline is per
# environment and refuses to be read across one.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      update-baseline:
        description: "Commit this run as the baseline for this environment"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only by the final step, which files an issue when a benchmark
      # regresses; without it that step fails and the regression goes unreported.
      issues: write
    timeout-minutes: 60
    outputs:
      baseline: ${{ steps.environment.outputs.baseline }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          # JDK 21: the static-analysis profile is active here, so the benchmarks
          # measure the code as it is actually analysed and shipped.
          distribution: temurin
          java-version: "21"
          cache: maven

      # The baseline is named after what produced it. A number from this runner
      # is comparable with another number from this runner and with nothing else,
      # and a file name that says so is harder to misuse than a comment asking
      # people not to.
      - name: Name the baseline after this environment
        id: environment
        run: |
          name="benchmarks/results/baseline-${{ runner.os }}-${{ runner.arch }}-jdk21.json"
          echo "baseline=$name" >> "$GITHUB_OUTPUT"
          echo "BASELINE=$name" >> "$GITHUB_ENV"

      - name: Build the benchmarks
        run: mvn -B --no-transfer-progress clean install -Pbenchmarks -DskipTests -DskipITs

      - name: Run
        run: |
          mkdir -p benchmarks/results
          java -jar acemq-amqp-benchmarks/target/benchmarks.jar \
               -rf json -rff benchmarks/results/current.json

      # The budget is a ratio between two figures measured minutes apart on the
      # same runner against the same broker, so it survives the noise that makes
      # an absolute number from shared hardware meaningless. This is the check
      # behind the claim in the README. It fails only when the whole confidence
      # interval is above the budget; a run too imprecise to decide says so and
      # passes.
      - name: Enforce the overhead budget against the raw client
        run: python3 etc/check-overhead-budget.py benchmarks/results/current.json 5

      - name: Compare against the baseline for this environment
        # Looser than the 5% budget on purpose: this compares across nights on
        # shared hardware, where the budget's within-run cancellation does not
        # apply. A benchmark regresses only when its whole interval is past the
        # threshold, and a missing baseline for this environment is reported
        # rather than treated as a pass or a failure.
        run: python3 etc/compare-benchmarks.py benchmarks/results/current.json "$BASELINE" 15

      - name: Publish the result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmarks/results/current.json
          retention-days: 90

      - name: Open an issue on regression
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh issue create \
            --title "Benchmark regression on $(echo "$SHA" | cut -c1-7)" \
            --label "area:core" \
            --body "A benchmark moved past its threshold by more than the measurement's own
          uncertainty, or a benchmark went missing.

          Commit: $SHA
          Run: $RUN_URL

          The comparison output in that run names which benchmark moved, by how much,
          and with what interval. Both checks require the whole confidence interval to
          be past the threshold before failing, so this is not a run that got unlucky.

          If the change is expected, re-run this workflow with update-baseline: true,
          which records the new baseline for this environment and says so in the commit."

  # A separate job, and separate for one reason: it is the only thing here that
  # needs contents: write. The benchmark job builds and runs code from the
  # repository, and a nightly that both runs the repository's code and can push
  # to its default branch is a wider blast radius than a baseline file is worth.
  # This job runs no repository code -- it downloads an artifact and commits it.
  #
  # It also closes a loop that was open: the update-baseline input existed and
  # nothing acted on it, so recording a baseline meant downloading an artifact by
  # hand, which is why a laptop measurement from 26 August was still the baseline
  # in September.
  record-baseline:
    needs: benchmark
    if: github.event_name == 'workflow_dispatch' && inputs.update-baseline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          path: downloaded

      - name: Commit it as the baseline for this environment
        env:
          BASELINE: ${{ needs.benchmark.outputs.baseline }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p "$(dirname "$BASELINE")"
          cp downloaded/current.json "$BASELINE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BASELINE"
          git commit -m "Record the benchmark baseline for $(basename "$BASELINE" .json)

          Measured by run $RUN_ID on $SHA. Comparable with runs from that
          environment and with no other."
          git push
