# Throwaway. Answers one question: does a job output survive the job failing?
# The release notification depends on it, and guessing wrong means silence on
# the only failure worth interrupting anyone for.
name: output-probe
on:
  workflow_dispatch:

jobs:
  publish-like:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.push.outputs.published }}
    steps:
      - id: push
        run: echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Fail after the output was set
        run: exit 1

  notify-like:
    needs: publish-like
    if: always() && needs.publish-like.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "REACHED - outputs survive a failed job (result=${{ needs.publish-like.result }})"
