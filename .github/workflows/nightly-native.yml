name: nightly-native

# Building a native image takes minutes, so it does not belong in the ordinary
# build. It does belong somewhere: "AceMQ works ahead-of-time" is a claim, and a
# dependency bump is what quietly breaks it. Nothing here needs a broker.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native image on GraalVM ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported. A break usually lands on one and
        # not the other, and knowing which narrows it immediately.
        #
        # The distribution is pinned per entry, and 21 is Oracle GraalVM rather
        # than community for a reason worth writing down.
        #
        # GraalVM Community for JDK 21 ended at 21.0.2. That build cannot link a
        # native image: after compiling the whole thing it fails with
        #
        #   undefined reference to `Java_jdk_internal_misc_ScopedMemoryAccess_closeScope0'
        #
        # which reads like a fault in this repository and is not one -- the
        # symbol is missing from 21.0.2's own static libraries. It was tested on
        # ubuntu-22.04 as well as 24.04 in case the host toolchain was to blame;
        # it is not, the result is identical on both.
        #
        # There is no later community build to move to, so the choice is Oracle
        # GraalVM (patched 21.0.x, free for production use under the GraalVM Free
        # Terms and Conditions), Liberica NIK, or dropping JDK 21 from this
        # matrix. Oracle's is used here because it keeps the coverage; it is a
        # build-time toolchain for a smoke test that is never distributed, so the
        # licence reaches nothing we ship.
        include:
          - java: "21"
            distribution: graalvm
            os: ubuntu-latest
          - java: "25"
            distribution: graalvm-community
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.java }}
          distribution: ${{ matrix.distribution }}
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the toolchain
        run: |
          java -version
          native-image --version

      - name: Install the reactor
        # The smoke test consumes this commit rather than a published snapshot,
        # so the modules it depends on have to be in the local repository first.
        run: mvn -B --no-transfer-progress install -DskipTests -DskipITs -Djacoco.skip=true

      - name: Build a native image and run it
        # clean, deliberately. Without it the plugin can reuse the previous
        # binary and report a pass for code that was never compiled.
        run: mvn -B --no-transfer-progress -Pnative -pl acemq-amqp-native clean verify

  # Decides whether this run is worth a message, and what it should say.
  #
  # Failure-only notification had a gap that cost somebody a day: you are told
  # when it breaks and never told when it is fixed, so after a red morning the
  # silence is indistinguishable from a job that is still broken. This adds the
  # other edge -- a green run that follows a failure announces the recovery --
  # while keeping the original point, which is that a nightly saying "still fine"
  # every morning is a channel people mute.
  #
  # So: red every time it breaks, green once when it comes back, silence in
  # between.
  outcome:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading this workflow's own previous conclusion.
      actions: read
    outputs:
      notify: ${{ steps.decide.outputs.notify }}
      status: ${{ steps.decide.outputs.status }}
      title: ${{ steps.decide.outputs.title }}
      message: ${{ steps.decide.outputs.message }}
      icon: ${{ steps.decide.outputs.icon }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.native.result }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$RESULT" = "failure" ]; then
            {
              echo "notify=true"
              echo "status=failure"
              echo "title=AceMQ for Java native image FAILED"
              echo "message=GraalVM 21 and 25. See the run for which one broke and on which check."
              echo "icon="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Green. Worth saying only if the run before it was not.
          previous=$(gh run list --repo "$REPO" --workflow nightly-native.yml \
                       --branch main --status completed --limit 10 \
                       --json databaseId,conclusion \
                       --jq "[.[] | select(.databaseId != ${RUN_ID})][0].conclusion" || echo "")
          echo "previous completed run concluded: ${previous:-unknown}"

          if [ "$previous" = "success" ] || [ -z "$previous" ]; then
            echo "notify=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "notify=true"
              echo "status=success"
              echo "title=AceMQ for Java native image is green again"
              echo "message=GraalVM 21 and 25 both build and run the smoke test. The previous run was ${previous}."
              echo "icon=:sparkles:"
            } >> "$GITHUB_OUTPUT"
          fi

  notify:
    needs: outcome
    if: always() && needs.outcome.outputs.notify == 'true'
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.outcome.outputs.status }}
      title: ${{ needs.outcome.outputs.title }}
      message: ${{ needs.outcome.outputs.message }}
      icon: ${{ needs.outcome.outputs.icon }}
    secrets: inherit
