# Publish a release into the Git-hosted Maven repository at AceMQ-Company/maven,
# which is served over GitHub Pages at https://acemq-company.github.io/maven/.
#
# Triggered by a tag:  git tag v0.1.0 && git push origin v0.1.0
#
# The built-in GITHUB_TOKEN is scoped to this repository, so it cannot push to
# the two others this release writes to. Each gets its own **deploy key**, held
# here as MAVEN_REPO_DEPLOY_KEY and LANDING_PAGE_DEPLOY_KEY:
#
#   - a deploy key can write to exactly one repository and nothing else, which
#     a personal access token cannot express -- the one this replaced carried
#     admin:org, delete_repo and repo across every repository its owner could
#     reach, to push two commits;
#   - it belongs to the repository rather than to a person, so it survives them
#     leaving and cannot be used as them;
#   - it does not expire, so a release cannot fail at three in the morning
#     because a token quietly aged out.
#
# Rotating one: generate a key pair, replace the deploy key on the target
# repository, then update the secret here. Both are listed under the target
# repository's Settings -> Deploy keys.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      # Whether anything reached the Maven repository. False for every failure
      # before the push, which is most of them.
      published: ${{ steps.push.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 rather than the newest available: the NullAway and ErrorProne
          # profile is bound to [21,24), so building the release on anything
          # newer would publish artifacts that never met the static analysis
          # gate the pull requests are held to.
          java-version: '21'
          cache: maven

      - name: Work out the version
        id: version
        env:
          # Through the environment rather than interpolated into the script.
          # A tag name and a dispatch input are both caller-controlled text, and
          # inlining either one lets whoever writes it run shell here.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${TAG_NAME#v}"
          fi
          # An allow-list, not a deny-list. The version is concatenated into a
          # Maven argument and a commit message, so anything that is not plainly
          # a version number is refused rather than escaped.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "not a release version: '$VERSION'" >&2
            exit 1
          fi
          case "$VERSION" in
            *SNAPSHOT*)
              echo "refusing to publish a SNAPSHOT to the release repository: $VERSION" >&2
              exit 1
              ;;
          esac
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

      - name: Build and test
        # The full build, including integration tests against real brokers. A
        # release is the one moment where waiting for the slow suite is worth
        # it: this is the artifact people will actually depend on.
        run: mvn -B --no-transfer-progress verify

      - name: Check out the Maven repository
        uses: actions/checkout@v4
        with:
          repository: AceMQ-Company/maven
          # A deploy key rather than a token: write access to this repository
          # alone, and to nothing else in the organisation.
          ssh-key: ${{ secrets.MAVEN_REPO_DEPLOY_KEY }}
          path: maven-repo

      - name: Deploy into it
        # Cloned first, then deployed into, so maven-metadata.xml merges with
        # what is already published. Deploying into an empty directory would
        # rewrite the metadata with only this version, leaving earlier releases
        # on disk but invisible to anything that reads it.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mvn -B --no-transfer-progress versions:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress -Prelease -DskipTests -DskipITs \
            -Djacoco.skip=true -Dgpg.skip=true \
            deploy -DaltDeploymentRepository="acemq::default::file://$GITHUB_WORKSPACE/maven-repo"

      # The landing page tells people which version to depend on. Updating it by
      # hand meant it sat two releases behind, telling every visitor to use a
      # version that was no longer current. The release owns it now.
      - name: Point the landing page at this version
        working-directory: maven-repo
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - "$VERSION" <<'PYTHON'
          import pathlib, re, sys
          version = sys.argv[1]
          # These two files quote the current release and nothing else, so every
          # version-shaped string in them is the one being replaced.
          for name in ("index.html", "README.md"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              updated = re.sub(r"\b0\.\d+\.\d+\b", version, text)
              if updated != text:
                  path.write_text(updated)
                  print(f"  {name} now advertises {version}")
          PYTHON

      # `published` is the line between "nothing happened" and "something is out
      # there". Everything before this step leaves the Maven repository untouched;
      # everything after it is operating on a version consumers can already
      # resolve. The notification at the end keys off it -- see that job for why.
      - name: Commit and push
        id: push
        working-directory: maven-repo
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "acemq-release"
          git config user.email "noreply@acemq.org"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish; $VERSION may already exist"
            # Already in the repository, so from a consumer's point of view this
            # version is published. Reporting otherwise would make a re-run of a
            # good release look like a release that never happened.
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Publish $VERSION"
          git push origin HEAD
          echo "published=true" >> "$GITHUB_OUTPUT"

      # The step that would have caught the bad 0.2.1. That release was published
      # from a working tree whose fix had never been committed, so the artifacts
      # did not match the repository and nothing noticed until CI in another
      # repository failed. Resolving the new version from an empty local
      # repository is the only check that asks what a consumer will actually get.
      - name: Verify the published version resolves
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "Waiting for GitHub Pages to serve $VERSION"
          POM="https://acemq-company.github.io/maven/org/acemq/acemq-amqp-core/$VERSION/acemq-amqp-core-$VERSION.pom"
          for attempt in $(seq 1 20); do
            # -L because the repository has a custom domain: every github.io URL
            # answers 301 to https://acemq.org/maven/... . Without it this step
            # reported a perfectly good 0.2.4 as unpublished, having seen the
            # redirect and compared it against 200. Maven itself follows the
            # redirect, which is why the resolve below passed while this failed.
            code=$(curl -sL -o /dev/null -w '%{http_code}' "$POM")
            [ "$code" = "200" ] && break
            echo "  attempt $attempt: HTTP $code"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::$VERSION was pushed but is not being served at $POM"
            exit 1
          fi

          # An empty local repository, so nothing can resolve from what this
          # build just installed. A release that only works on the machine that
          # made it is the failure being guarded against.
          mvn -B --no-transfer-progress -Dmaven.repo.local="$RUNNER_TEMP/verify-m2" \
            dependency:get \
            -DremoteRepositories=https://acemq-company.github.io/maven/ \
            -Dartifact="org.acemq:acemq-amqp-core:$VERSION"
          echo "$VERSION resolves from a clean repository."

      - name: Where it landed
        id: landed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "Published $VERSION to" \
               "https://acemq-company.github.io/maven/"
          echo "Pages takes a minute or two to serve the new files."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # The guide tells people which version to depend on. Left to a manual step it
  # sat two releases behind, which is worse than saying nothing: a reader copies
  # it and gets a version that is no longer current.
  document:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point the documentation at this release
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          .github/scripts/set-documented-version.sh "$VERSION"
          if [ -z "$(git status --porcelain)" ]; then
            echo "documentation already current"
            exit 0
          fi
          git config user.name "acemq-release"
          git config user.email "noreply@acemq.org"
          git add -A
          git commit -m "docs: point at $VERSION"
          git push origin main

  # The organisation landing page shows the current release on its Java card, and
  # it drifted for the same reason the other two did: a version written by hand.
  # Three places now, all owned by the release.
  landing-page:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AceMQ-Company/AceMQ-Company.github.io
          ssh-key: ${{ secrets.LANDING_PAGE_DEPLOY_KEY }}
      - name: Show this release on the landing page
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PYTHON'
          import pathlib, re, sys
          version = sys.argv[1]
          page = pathlib.Path("index.html")
          text = page.read_text()
          # Every version-shaped string on this page refers to the Java library.
          updated = re.sub(r"\b0\.\d+\.\d+\b", version, text)
          if updated != text:
              page.write_text(updated)
              print(f"landing page now shows {version}")
          else:
              print("landing page already current")
          PYTHON
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "acemq-release"
          git config user.email "noreply@acemq.org"
          git commit -am "Show $VERSION on the Java card"
          git push

  # Announced only when something actually reached the Maven repository.
  #
  # A tag whose build fails has released nothing: the repository is untouched, no
  # version exists, and nobody can resolve anything they could not resolve before.
  # Announcing that as "release FAILED" puts a red message in a channel about an
  # event that did not happen, and a channel that cries wolf is one people stop
  # reading -- which costs us the announcement that matters. The failure is not
  # hidden: it is a red tag build in Actions, and whoever pushed the tag is
  # watching it.
  #
  # What does get announced is anything from the push onwards, including failure.
  # A version that is published but did not finish its release is the genuinely
  # dangerous state -- consumers can resolve it while the documentation still
  # names the previous one -- and that is worth interrupting someone for.
  notify:
    needs: publish
    if: always() && needs.publish.outputs.published == 'true'
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.publish.result }}
      title: >-
        ${{ needs.publish.result == 'success'
            && format('AceMQ for Java {0} released', github.ref_name)
            || format('AceMQ for Java {0} is published but the release did not finish', github.ref_name) }}
      message: >-
        ${{ needs.publish.result == 'success'
            && 'Artifacts are on the Maven repository. Consumers need no credentials.'
            || 'The artifacts are on the Maven repository and consumers can resolve them, but a later step failed, so the documentation and the landing page may still name the previous version. Check the run.' }}
      # Roadworks rather than a red dot: the release is usable and unfinished,
      # which is a different thing from broken and reads differently at a glance.
      icon: ${{ needs.publish.result == 'success' && '' || ':construction:' }}
      url: https://acemq-company.github.io/maven/
    secrets: inherit
