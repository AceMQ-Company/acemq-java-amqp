# Publish a release into the Git-hosted Maven repository at AceMQ-Company/maven,
# which is served over GitHub Pages at https://acemq-company.github.io/maven/.
#
# Triggered by a tag:  git tag v0.1.0 && git push origin v0.1.0
#
# Needs a secret named MAVEN_REPO_TOKEN: a token with write access to
# AceMQ-Company/maven. The built-in GITHUB_TOKEN is scoped to this repository
# only, so it cannot push to another one.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 0.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21 rather than the newest available: the NullAway and ErrorProne
          # profile is bound to [21,24), so building the release on anything
          # newer would publish artifacts that never met the static analysis
          # gate the pull requests are held to.
          java-version: '21'
          cache: maven

      - name: Work out the version
        id: version
        env:
          # Through the environment rather than interpolated into the script.
          # A tag name and a dispatch input are both caller-controlled text, and
          # inlining either one lets whoever writes it run shell here.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${TAG_NAME#v}"
          fi
          # An allow-list, not a deny-list. The version is concatenated into a
          # Maven argument and a commit message, so anything that is not plainly
          # a version number is refused rather than escaped.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "not a release version: '$VERSION'" >&2
            exit 1
          fi
          case "$VERSION" in
            *SNAPSHOT*)
              echo "refusing to publish a SNAPSHOT to the release repository: $VERSION" >&2
              exit 1
              ;;
          esac
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION"

      - name: Build and test
        # The full build, including integration tests against real brokers. A
        # release is the one moment where waiting for the slow suite is worth
        # it: this is the artifact people will actually depend on.
        run: mvn -B --no-transfer-progress verify

      - name: Check out the Maven repository
        uses: actions/checkout@v4
        with:
          repository: AceMQ-Company/maven
          token: ${{ secrets.MAVEN_REPO_TOKEN }}
          path: maven-repo

      - name: Deploy into it
        # Cloned first, then deployed into, so maven-metadata.xml merges with
        # what is already published. Deploying into an empty directory would
        # rewrite the metadata with only this version, leaving earlier releases
        # on disk but invisible to anything that reads it.
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mvn -B --no-transfer-progress versions:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress -Prelease -DskipTests -DskipITs \
            -Djacoco.skip=true -Dgpg.skip=true \
            deploy -DaltDeploymentRepository="acemq::default::file://$GITHUB_WORKSPACE/maven-repo"

      - name: Commit and push
        working-directory: maven-repo
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "acemq-release"
          git config user.email "noreply@acemq.org"
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish; $VERSION may already exist"
            exit 0
          fi
          git add -A
          git commit -m "Publish $VERSION"
          git push origin HEAD

      # The step that would have caught the bad 0.2.1. That release was published
      # from a working tree whose fix had never been committed, so the artifacts
      # did not match the repository and nothing noticed until CI in another
      # repository failed. Resolving the new version from an empty local
      # repository is the only check that asks what a consumer will actually get.
      - name: Verify the published version resolves
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "Waiting for GitHub Pages to serve $VERSION"
          POM="https://acemq-company.github.io/maven/org/acemq/acemq-amqp-core/$VERSION/acemq-amqp-core-$VERSION.pom"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$POM")
            [ "$code" = "200" ] && break
            echo "  attempt $attempt: HTTP $code"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::$VERSION was pushed but is not being served at $POM"
            exit 1
          fi

          # An empty local repository, so nothing can resolve from what this
          # build just installed. A release that only works on the machine that
          # made it is the failure being guarded against.
          mvn -B --no-transfer-progress -Dmaven.repo.local="$RUNNER_TEMP/verify-m2" \
            dependency:get \
            -DremoteRepositories=https://acemq-company.github.io/maven/ \
            -Dartifact="org.acemq:acemq-amqp-core:$VERSION"
          echo "$VERSION resolves from a clean repository."

      - name: Where it landed
        id: landed
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "Published $VERSION to" \
               "https://acemq-company.github.io/maven/org/acemq/"
          echo "Pages takes a minute or two to serve the new files."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # Announced whatever happened. A release that fails silently is the one that
  # gets discovered a week later by somebody wondering why the version they were
  # told about cannot be resolved.
  notify:
    needs: publish
    if: always()
    uses: AceMQ-Company/acemq-java-amqp/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.publish.result }}
      title: >-
        ${{ needs.publish.result == 'success'
            && format('AceMQ for Java {0} released', github.ref_name)
            || format('AceMQ for Java {0} release FAILED', github.ref_name) }}
      message: >-
        ${{ needs.publish.result == 'success'
            && 'Artifacts are on the Maven repository. Consumers need no credentials.'
            || 'The tag is pushed but the artifacts are not published. Nothing is half-released; the repository is untouched.' }}
      url: https://acemq-company.github.io/maven/org/acemq/
    secrets: inherit
